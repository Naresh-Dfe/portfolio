name: Portfolio CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build:cloudflare
        env:
          VITE_SITE_URL: ${{ vars.SITE_URL }}

  deploy:
    name: Deploy production
    needs: quality
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: portfolio-production
      cancel-in-progress: false
    env:
      VITE_SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Check deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Configure the CLOUDFLARE_API_TOKEN repository or production-environment secret."; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Configure the CLOUDFLARE_ACCOUNT_ID repository variable."; exit 1; }
          node --input-type=module -e "const value = process.env.VITE_SITE_URL; const url = new URL(value); if (url.protocol !== 'https:' || value !== url.origin) throw new Error('Configure SITE_URL as the HTTPS production origin without a path or trailing slash');"
      - run: npm ci
      - run: npm run build:cloudflare
      - name: Publish Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.1"
          command: deploy --config .output/server/wrangler.json
      - name: Verify production
        run: node scripts/verify-deployment.mjs "$VITE_SITE_URL"
